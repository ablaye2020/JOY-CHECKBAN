<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYBOY · One Piece</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* === IMAGE DE FOND (GRANDE) === */
        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.65;
            pointer-events: none;
            filter: brightness(0.5) saturate(1.2);
            transform: scale(1.02);
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
        }

        /* === PARTICULES === */
        .particle-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: floatParticle 10s ease-in-out infinite;
            box-shadow: 0 0 20px currentColor;
        }

        .particle.gold { background: #ffd700; color: #ffd700; }
        .particle.red { background: #ff2200; color: #ff2200; }

        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.7; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .particle:nth-child(1) { --tx: 300px; --ty: -250px; animation-delay: 0s; left: 5%; top: 10%; }
        .particle:nth-child(2) { --tx: -280px; --ty: 350px; animation-delay: 1.2s; left: 20%; top: 35%; }
        .particle:nth-child(3) { --tx: 400px; --ty: 220px; animation-delay: 2.4s; left: 50%; top: 20%; }
        .particle:nth-child(4) { --tx: -350px; --ty: -280px; animation-delay: 3.6s; left: 70%; top: 55%; }
        .particle:nth-child(5) { --tx: 250px; --ty: -400px; animation-delay: 4.8s; left: 10%; top: 70%; }
        .particle:nth-child(6) { --tx: -220px; --ty: 450px; animation-delay: 6s; left: 40%; top: 5%; }
        .particle:nth-child(7) { --tx: 450px; --ty: 180px; animation-delay: 7.2s; left: 60%; top: 45%; }
        .particle:nth-child(8) { --tx: -400px; --ty: -350px; animation-delay: 8.4s; left: 30%; top: 80%; }

        /* === CARTE PRINCIPALE === */
        .scroll-effect {
            position: relative;
            z-index: 10;
            background: rgba(10, 8, 6, 0.60);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 35px;
            max-width: 580px;
            width: 100%;
            border: 1px solid rgba(180, 120, 60, 0.08);
            text-align: center;
        }

        /* === LOGO WHATSAPP === */
        .wa-top {
            position: absolute;
            top: -18px;
            right: -6px;
            background: rgba(37, 211, 102, 0.12);
            border-radius: 50%;
            padding: 10px;
            border: 2px solid rgba(37, 211, 102, 0.10);
            animation: waFloat 3s ease-in-out infinite;
        }

        .wa-top svg {
            width: 28px;
            height: 28px;
            fill: #25D366;
            display: block;
            filter: drop-shadow(0 0 15px rgba(37, 211, 102, 0.15));
        }

        @keyframes waFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        /* === TITRE === */
        .main-title {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #ffd700;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.10);
            font-family: 'Georgia', serif;
            margin-bottom: 2px;
        }
        .main-title span { color: #ff2200; text-shadow: 0 0 40px rgba(255, 34, 0, 0.15); }

        .main-title::after {
            content: '';
            display: block;
            width: 30%;
            height: 2px;
            margin: 6px auto 0;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
        }

        .sub-title {
            color: rgba(255, 215, 0, 0.40);
            font-size: 13px;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            margin-top: 12px;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* === IMAGE D'ACCUEIL === */
        .home-image-in {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            transition: 0.4s;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.02);
        }
        .home-image-in:hover { transform: scale(1.01); }

        /* === BOUTONS AVEC EFFETS === */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 8px 0 10px;
        }

        .btn-path {
            padding: 18px 30px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Georgia', serif;
            letter-spacing: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-path .icon {
            margin-right: 12px;
            font-size: 22px;
        }

        /* BOUTON FAMILY (OR) */
        .btn-family {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.10), rgba(255, 215, 0, 0.02));
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.12);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }
        .btn-family::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), transparent, rgba(255, 215, 0, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: 0.5s;
        }
        .btn-family:hover::before { opacity: 1; }
        .btn-family:hover {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.10), inset 0 0 40px rgba(255, 215, 0, 0.02);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(255, 215, 0, 0.04));
            border-color: rgba(255, 215, 0, 0.25);
        }

            background: linear-gradient(135deg, rgba(255, 34, 0,
