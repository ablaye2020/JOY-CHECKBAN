<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠️ Joy Boy Checker - WhatsApp Exclu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Bannière Joy Boy -->
        <header class="joy-header">
            <h1 class="joy-title">☠️ JOY BOY <span class="highlight">CHECKER</span></h1>
            <p class="subtitle">"Le retour du Roi des Pirates - Vérifie tes numéros"</p>
            <div class="skull-decoration">💀</div>
        </header>

        <!-- Zone de vérification -->
        <main class="checker-area">
            <div class="input-group">
                <textarea id="numbersInput" placeholder="Entrez les numéros (un par ligne)&#10;Ex:&#10;+221 77 123 45 67&#10;+221 70 123 45 67" rows="8"></textarea>
                <button id="checkBtn" class="pirate-btn">
                    <span class="btn-icon">⚔️</span> VÉRIFIER
                </button>
            </div>

            <!-- Filtres -->
            <div class="filters">
                <label class="filter-label">
                    <input type="checkbox" id="showExcluded" checked> 
                    🚫 Afficher exclus
                </label>
                <label class="filter-label">
                    <input type="checkbox" id="showValid" checked> 
                    ✅ Afficher valides
                </label>
                <button id="clearBtn" class="clear-btn">🗑️ Effacer tout</button>
            </div>

            <!-- Résultats -->
            <div id="resultContainer" class="result-container">
                <div class="stats">
                    <div class="stat-card total">
                        <span class="stat-number" id="totalCount">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                    <div class="stat-card excluded">
                        <span class="stat-number" id="excludedCount">0</span>
                        <span class="stat-label">🚫 Exclus</span>
                    </div>
                    <div class="stat-card valid">
                        <span class="stat-number" id="validCount">0</span>
                        <span class="stat-label">✅ Valides</span>
                    </div>
                </div>

                <div class="results-list" id="resultsList">
                    <!-- Les résultats apparaîtront ici -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="joy-footer">
            <p>🏴‍☠️ Joy Boy Checker v1.0 - L'ère des vérifications est arrivée !</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
